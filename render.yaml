services:
  - name: escrow-api
    region: oregon
    plan: free
    type: web
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: ESCROW_AUTO_RELEASE_DAYS
        value: "7"
      - key: FRONTEND_URL
        value: "*"