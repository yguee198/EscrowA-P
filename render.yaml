# Render Blueprint - Backend API
# https://render.com/docs/blueprint-spec

databases:
  - name: escrow-db
    region: oregon
    plan: free
    databaseName: escrow_db
    databaseUser: escrow_user

services:
  - name: escrow-api
    region: oregon
    plan: free
    type: web
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: escrow-db
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_HOST
        fromService:
          name: escrow-redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: escrow-redis
          property: port
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: ESCROW_AUTO_RELEASE_DAYS
        value: "7"

  - name: escrow-redis
    region: oregon
    plan: free
    type: redis
    ipAllowList: []
    redisVersion: "7"