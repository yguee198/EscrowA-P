# Render Blueprint - Backend API
# https://render.com/docs/blueprint-spec

databases:
  # PostgreSQL Database (Managed)
  - name: escrow-db
    region: oregon
    plan: starter
    databaseName: escrow_db
    databaseUser: escrow_user

services:
  # Backend API Service
  - name: escrow-api
    region: oregon
    plan: starter
    type: web
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: escrow-db
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_HOST
        fromService:
          name: escrow-redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: escrow-redis
          property: port
      - key: BCRYPT_ROUNDS
        value: 12
      - key: ESCROW_AUTO_RELEASE_DAYS
        value: 7

  # Redis Service (Managed)
  - name: escrow-redis
    region: oregon
    plan: starter
    type: redis
    ipAllowList: []
    redisVersion: "7"
