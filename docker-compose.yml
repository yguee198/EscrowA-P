version: '3.8'

services:
  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: escrow_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - escrow_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: escrow_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6543
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - escrow_network
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: escrow_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:3000
    depends_on:
      - backend
    networks:
      - escrow_network
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  redis_data:

networks:
  escrow_network:
    driver: bridge